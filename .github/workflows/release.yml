# Релизные сборки. Запускается на тег `v*`, поставленный на main: версия в теге
# обязана совпадать с версией в tauri.conf.json, а сам коммит — быть в истории
# main. Готовые файлы уходят в опубликованный релиз GitHub, ссылки на скачивание
# перечислены в его описании.
#
# Ручной запуск со страницы Actions собирает те же файлы, но релиз не создаёт:
# артефакты прикладываются к прогону.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Тег
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Нужна история main, иначе не проверить, что тег стоит на ней.
          fetch-depth: 0

      - id: check
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Ручной запуск, версия $version. Проверки тега пропущены."
            exit 0
          fi

          # Tauri берёт версию из tauri.conf.json; тег обязан ей соответствовать,
          # иначе релиз v1.2.0 будет содержать пакеты 1.1.0.
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tauri.conf.json: $version, тег: $tag"
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::тег $GITHUB_REF_NAME не на main"
            exit 1
          fi

          echo "Тег $GITHUB_REF_NAME на main, версия $version."

  linux:
    name: Linux (deb, AppImage)
    needs: [check]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            wasm
          key: linux

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - run: bun install --frozen-lockfile

      # beforeBuildCommand из tauri.conf.json сам соберёт wasm и фронт.
      - name: Сборка
        run: bun run tauri build --bundles deb,appimage

      - name: Имена файлов
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/deb/*.deb \
            "out/Docpoint-$VERSION-linux-x86_64.deb"
          cp src-tauri/target/release/bundle/appimage/*.AppImage \
            "out/Docpoint-$VERSION-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  arch:
    name: Arch Linux (бинарник, пакет pacman)
    needs: [check]
    runs-on: ubuntu-latest
    # Сборка внутри Arch: бинарник линкуется с теми же версиями webkit2gtk и
    # glibc, что стоят у пользователя, и заодно проверяется, что проект на Arch
    # вообще собирается.
    container: archlinux:latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      # До checkout: actions/checkout требует git в контейнере.
      - name: Системные зависимости
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git \
            bun rust rust-wasm wasm-pack \
            webkit2gtk-4.1 gtk3 libayatana-appindicator librsvg

      - uses: actions/checkout@v4

      - run: bun install --frozen-lockfile

      # Без бандлов: deb и AppImage собирает job Linux, здесь нужен бинарник.
      - name: Сборка
        run: bun run tauri build --no-bundle

      - name: Tarball
        run: |
          dir="docpoint-$VERSION-x86_64"
          mkdir -p "$dir/icons"
          cp src-tauri/target/release/docpoint "$dir/"
          cp packaging/linux/docpoint.desktop "$dir/"
          cp src-tauri/icons/32x32.png src-tauri/icons/128x128.png "$dir/icons/"
          cp LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"

      - name: Пакет pacman
        run: |
          cp "docpoint-$VERSION-x86_64.tar.gz" packaging/arch/
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/arch/PKGBUILD
          # makepkg отказывается работать от root.
          useradd --create-home builder
          chown -R builder packaging/arch
          su builder -c "cd packaging/arch && makepkg --noconfirm --force"

      - name: Имена файлов
        run: |
          mkdir -p out
          cp "docpoint-$VERSION-x86_64.tar.gz" \
            "out/Docpoint-$VERSION-arch-x86_64.tar.gz"
          cp packaging/arch/*.pkg.tar.zst \
            "out/Docpoint-$VERSION-arch-x86_64.pkg.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: out/*
          if-no-files-found: error

  windows:
    name: Windows (msi, exe)
    needs: [check]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            wasm
          key: windows

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - run: bun install --frozen-lockfile

      - name: Сборка
        run: bun run tauri build --bundles msi,nsis

      - name: Имена файлов
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/msi/*.msi \
            "out/Docpoint-$VERSION-windows-x86_64.msi"
          cp src-tauri/target/release/bundle/nsis/*.exe \
            "out/Docpoint-$VERSION-windows-x86_64-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  release:
    name: Публикация
    needs: [check, linux, arch, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Репозиторий не выкачивается, поэтому gh нужно указать его явно.
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Контрольные суммы
        working-directory: assets
        # Во временный файл, иначе sha256sum посчитает сумму сам с себя.
        run: |
          sha256sum * > ../SHA256SUMS
          mv ../SHA256SUMS .

      - name: Описание релиза
        run: |
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          cat > notes.md <<EOF
          ## Скачать

          | Система | Файл |
          | --- | --- |
          | Arch Linux, пакет | [Docpoint-$VERSION-arch-x86_64.pkg.tar.zst]($base/Docpoint-$VERSION-arch-x86_64.pkg.tar.zst) |
          | Arch Linux, бинарник | [Docpoint-$VERSION-arch-x86_64.tar.gz]($base/Docpoint-$VERSION-arch-x86_64.tar.gz) |
          | Debian, Ubuntu | [Docpoint-$VERSION-linux-x86_64.deb]($base/Docpoint-$VERSION-linux-x86_64.deb) |
          | Linux, портативно | [Docpoint-$VERSION-linux-x86_64.AppImage]($base/Docpoint-$VERSION-linux-x86_64.AppImage) |
          | Windows, установщик | [Docpoint-$VERSION-windows-x86_64-setup.exe]($base/Docpoint-$VERSION-windows-x86_64-setup.exe) |
          | Windows, msi | [Docpoint-$VERSION-windows-x86_64.msi]($base/Docpoint-$VERSION-windows-x86_64.msi) |

          Контрольные суммы: [SHA256SUMS]($base/SHA256SUMS).

          \`\`\`bash
          sudo pacman -U Docpoint-$VERSION-arch-x86_64.pkg.tar.zst   # Arch
          sudo apt install ./Docpoint-$VERSION-linux-x86_64.deb      # Debian, Ubuntu
          chmod +x Docpoint-$VERSION-linux-x86_64.AppImage           # портативно
          \`\`\`

          Сборки не подписаны: Windows покажет предупреждение SmartScreen.
          EOF

      - name: Релиз
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --title "Docpoint $TAG" --notes-file notes.md
          else
            gh release create "$TAG" assets/* \
              --title "Docpoint $TAG" \
              --notes-file notes.md
          fi
