<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Reference — Lesser Known Laravel</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
/* ═══════════════ TOKENS ═══════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --font-serif: 'Lora', Georgia, 'Times New Roman', serif;
  --font-sans:  'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:  'Menlo', 'SF Mono', 'Courier New', monospace;

  --text-xs:   11px;
  --text-sm:   13px;
  --text-base: 15px;
  --text-md:   18px;
  --text-lg:   24px;
  --text-xl:   30px;

  --lh-tight:  1.2;
  --lh-base:   1.6;
  --lh-relaxed:1.75;

  --bg:          #FAF7F2;
  --surface:     #FFFFFF;
  --ink:         #1A1A1A;
  --ink-mid:     #555555;
  --ink-low:     #888888;
  --border:      #E8E2D9;
  --border-hover:#C8C0B4;
  --green:       #1E7E52;  --green-bg:  #EAF5EF;
  --amber:       #9A5F00;  --amber-bg:  #FFF3DC;
  --red:         #9A2800;  --red-bg:    #FFF0EC;
  --cat-bg:      #F0EDE8;  --cat-ink:   #4A4540;
  --blue:        #1A5EA8;  --blue-bg:   #EAF1FB;
  --code-bg:     #F4F1EC;  --code-ink:  #3D2B1F;

  /* HTTP method badge colors */
  --get:    #1E7E52; --get-bg:    #EAF5EF;
  --post:   #1A5EA8; --post-bg:   #EAF1FB;
  --put:    #9A5F00; --put-bg:    #FFF3DC;
  --patch:  #7A4F9A; --patch-bg:  #F3EAFB;
  --delete: #9A2800; --delete-bg: #FFF0EC;
}

html, body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--lh-base);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  height: 100%;
  overflow: hidden;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-serif);
  font-weight: 400;
  color: var(--ink);
  line-height: var(--lh-tight);
}

#root { height: 100vh; display: flex; flex-direction: column; }

/* ═══════════════ NAV ═══════════════ */
.nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 56px;
  flex-shrink: 0;
  z-index: 100;
}
.nav-brand {
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 400;
  color: var(--ink);
  letter-spacing: -.2px;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-brand-sep {
  width: 1px;
  height: 14px;
  background: var(--border);
}
.nav-brand-section {
  font-family: var(--font-sans);
  font-size: 13px;
  color: var(--ink-low);
  font-weight: 400;
}
.nav-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-badge {
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 500;
  background: var(--green-bg);
  color: var(--green);
  letter-spacing: .2px;
}
.nav-links { display: flex; align-items: center; gap: 4px; }
.nav-link {
  padding: 6px 12px;
  font-size: 13px;
  color: var(--ink-mid);
  border-radius: 6px;
  cursor: pointer;
  transition: background .15s, color .15s;
  text-decoration: none;
  background: none;
  border: none;
  font-family: var(--font-sans);
}
.nav-link:hover { background: var(--cat-bg); color: var(--ink); }
.nav-link.active { color: var(--ink); font-weight: 500; }
.nav-link.cta { background: var(--ink); color: #fff; margin-left: 4px; }
.nav-link.cta:hover { background: #333; }

/* ═══════════════ SHELL ═══════════════ */
.shell {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ═══════════════ SIDEBAR ═══════════════ */
.sidebar {
  width: 248px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-search {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.search-input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.search-input-wrap svg {
  position: absolute;
  left: 9px;
  width: 13px;
  height: 13px;
  color: var(--ink-low);
  pointer-events: none;
  flex-shrink: 0;
}
.search-input {
  width: 100%;
  padding: 7px 10px 7px 30px;
  font-size: 13px;
  font-family: var(--font-sans);
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  outline: none;
  transition: border-color .15s;
}
.search-input:focus { border-color: var(--border-hover); }
.search-input::placeholder { color: var(--ink-low); }

.sidebar-scroll { flex: 1; overflow-y: auto; padding: 10px 0 16px; }
.sidebar-scroll::-webkit-scrollbar { width: 3px; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.sidebar-group { margin-bottom: 4px; }
.sidebar-group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 14px 5px;
  cursor: pointer;
  user-select: none;
}
.sidebar-group-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink-low);
}
.sidebar-group-chevron {
  width: 12px;
  height: 12px;
  color: var(--border-hover);
  transition: transform .2s;
}
.sidebar-group-chevron.open { transform: rotate(180deg); }

.sidebar-items { padding: 2px 8px; display: flex; flex-direction: column; gap: 1px; }
.sidebar-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: 7px;
  cursor: pointer;
  transition: background .13s;
  text-decoration: none;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-family: var(--font-sans);
}
.sidebar-item:hover { background: var(--cat-bg); }
.sidebar-item.active { background: var(--cat-bg); }
.sidebar-item-method {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .3px;
  padding: 2px 6px;
  border-radius: 4px;
  flex-shrink: 0;
  min-width: 44px;
  text-align: center;
}
.sidebar-item-name {
  font-size: 12.5px;
  color: var(--ink-mid);
  font-family: var(--font-mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.sidebar-item.active .sidebar-item-name { color: var(--ink); font-weight: 500; }

/* ═══════════════ MAIN CONTENT ═══════════════ */
.main {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ═══════════════ ENDPOINT PANEL ═══════════════ */
.endpoint-panel {
  flex: 1;
  overflow-y: auto;
  padding: 32px 40px 60px;
}
.endpoint-panel::-webkit-scrollbar { width: 4px; }
.endpoint-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.endpoint-header { margin-bottom: 28px; }
.endpoint-title-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.method-badge {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .5px;
  padding: 4px 10px;
  border-radius: 5px;
  flex-shrink: 0;
}
.endpoint-path {
  font-family: var(--font-mono);
  font-size: 20px;
  color: var(--ink);
  letter-spacing: -.3px;
}
.endpoint-desc {
  font-size: 15px;
  color: var(--ink-mid);
  line-height: 1.75;
  max-width: 580px;
  margin-top: 6px;
}
.endpoint-tags-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  flex-wrap: wrap;
}
.tag {
  padding: 3px 9px;
  border-radius: 5px;
  font-size: 11px;
  background: var(--cat-bg);
  color: var(--cat-ink);
}
.tag.auth {
  background: var(--amber-bg);
  color: var(--amber);
}
.tag.new {
  background: var(--green-bg);
  color: var(--green);
}

/* ═══════════════ SECTION BLOCKS ═══════════════ */
.section-block { margin-bottom: 32px; }
.section-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink-low);
  margin-bottom: 12px;
}

/* ═══════════════ PARAMS TABLE ═══════════════ */
.params-table {
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface);
}
.params-table-head {
  display: grid;
  grid-template-columns: 170px 100px 1fr 80px;
  padding: 8px 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.params-table-head span {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: var(--ink-low);
}
.param-row {
  display: grid;
  grid-template-columns: 170px 100px 1fr 80px;
  padding: 11px 16px;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  align-items: start;
  transition: background .12s;
}
.param-row:last-child { border-bottom: none; }
.param-row:hover { background: var(--bg); }
.param-name {
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--code-ink);
  display: flex;
  align-items: center;
  gap: 5px;
}
.param-required {
  font-size: 10px;
  color: var(--red);
  font-family: var(--font-sans);
}
.param-type {
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--blue);
  padding-top: 1px;
}
.param-desc {
  font-size: 13px;
  color: var(--ink-mid);
  line-height: 1.6;
}
.param-default {
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--ink-low);
  padding-top: 1px;
}

/* ═══════════════ RESPONSE SECTION ═══════════════ */
.response-tabs {
  display: flex;
  gap: 0;
  border: 1px solid var(--border);
  border-radius: 10px 10px 0 0;
  overflow: hidden;
  background: var(--bg);
}
.response-tab {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 16px;
  font-size: 13px;
  color: var(--ink-mid);
  cursor: pointer;
  border-right: 1px solid var(--border);
  background: none;
  border-top: none;
  border-left: none;
  border-bottom: none;
  font-family: var(--font-sans);
  transition: background .13s, color .13s;
}
.response-tab:last-child { border-right: none; }
.response-tab:hover { background: var(--cat-bg); color: var(--ink); }
.response-tab.active { background: var(--surface); color: var(--ink); font-weight: 500; }
.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.response-body {
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 10px 10px;
  overflow: hidden;
  background: var(--surface);
}

/* ═══════════════ CODE BLOCK ═══════════════ */
.code-block {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.code-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.code-lang {
  font-size: 10px;
  font-weight: 500;
  color: var(--ink-low);
  letter-spacing: .5px;
  text-transform: uppercase;
}
.copy-btn {
  font-size: 11px;
  color: var(--ink-low);
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--font-sans);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 4px;
  transition: background .15s, color .15s;
}
.copy-btn:hover { background: var(--border); color: var(--ink); }
.copy-btn svg { width: 11px; height: 11px; }
.code-body {
  padding: 14px 16px;
  overflow-x: auto;
}
.code-body pre {
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.75;
  color: var(--code-ink);
  margin: 0;
  white-space: pre;
}
.hl-k { color: #1E7E52; }
.hl-s { color: #9A5F00; }
.hl-c { color: #A08070; }
.hl-t { color: #1A5EA8; }
.hl-m { color: #9A2800; }
.hl-p { color: #4A4540; }

/* ═══════════════ TRY IT OUT ═══════════════ */
.try-panel {
  margin-top: 28px;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface);
}
.try-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  cursor: pointer;
  user-select: none;
}
.try-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}
.try-title svg { width: 14px; height: 14px; color: var(--ink-mid); }
.try-chevron { width: 14px; height: 14px; color: var(--ink-low); transition: transform .2s; }
.try-chevron.open { transform: rotate(180deg); }
.try-body { padding: 18px 18px; display: flex; flex-direction: column; gap: 13px; }

.try-field { display: flex; flex-direction: column; gap: 5px; }
.try-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--ink-low);
}
.try-input {
  padding: 8px 11px;
  font-size: 13px;
  font-family: var(--font-mono);
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  outline: none;
  transition: border-color .15s;
}
.try-input:focus { border-color: var(--border-hover); background: var(--surface); }
.try-textarea {
  padding: 8px 11px;
  font-size: 12.5px;
  font-family: var(--font-mono);
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  outline: none;
  transition: border-color .15s;
  resize: vertical;
  min-height: 90px;
  line-height: 1.6;
}
.try-textarea:focus { border-color: var(--border-hover); background: var(--surface); }

.try-actions { display: flex; align-items: center; gap: 10px; padding-top: 4px; }
.btn-primary {
  padding: 9px 20px;
  background: var(--ink);
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  font-family: var(--font-sans);
  transition: background .15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn-primary:hover { background: #333; }
.btn-primary svg { width: 13px; height: 13px; }
.btn-ghost {
  padding: 9px 18px;
  background: transparent;
  color: var(--ink-mid);
  font-size: 13px;
  border: 1px solid var(--border);
  border-radius: 7px;
  cursor: pointer;
  font-family: var(--font-sans);
  transition: all .15s;
}
.btn-ghost:hover { border-color: var(--border-hover); color: var(--ink); }

.try-response {
  margin-top: 14px;
  border-top: 1px solid var(--border);
  padding-top: 14px;
}
.try-response-status {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.try-response-label { font-size: 11px; color: var(--ink-low); }
.try-response-code {
  font-size: 13px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 4px;
}
.try-response-time { font-size: 11px; color: var(--ink-low); margin-left: auto; }

/* ═══════════════ RIGHT CODE PANEL ═══════════════ */
.code-panel {
  width: 360px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  background: var(--code-bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.code-panel-tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  padding: 0 4px;
  overflow-x: auto;
  flex-shrink: 0;
}
.code-panel-tabs::-webkit-scrollbar { display: none; }
.code-panel-tab {
  padding: 10px 12px;
  font-size: 12px;
  color: var(--ink-low);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
  font-family: var(--font-sans);
  transition: color .13s;
}
.code-panel-tab:hover { color: var(--ink-mid); }
.code-panel-tab.active {
  color: var(--ink);
  font-weight: 500;
  border-bottom-color: var(--ink);
}
.code-panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.code-panel-body::-webkit-scrollbar { width: 3px; }
.code-panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.code-panel-section-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: var(--ink-low);
  margin-bottom: 4px;
}
.code-snippet {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.code-snippet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.code-snippet-lang {
  font-size: 10px;
  font-weight: 500;
  color: var(--ink-low);
  letter-spacing: .5px;
  text-transform: uppercase;
}
.code-snippet-copy {
  font-size: 11px;
  color: var(--ink-low);
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--font-sans);
  padding: 2px 6px;
  border-radius: 3px;
  transition: background .13s;
  display: flex;
  align-items: center;
  gap: 3px;
}
.code-snippet-copy:hover { background: var(--border); color: var(--ink); }
.code-snippet-copy svg { width: 10px; height: 10px; }
.code-snippet pre {
  padding: 12px 14px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.75;
  color: var(--code-ink);
  overflow-x: auto;
  white-space: pre;
}

/* ═══════════════ CALLOUT ═══════════════ */
.callout {
  border-radius: 8px;
  padding: 11px 14px;
  margin: 16px 0;
  display: flex;
  gap: 10px;
}
.callout.tip  { background: var(--green-bg); border-left: 3px solid var(--green); }
.callout.warn { background: var(--amber-bg); border-left: 3px solid var(--amber); }
.callout.info { background: var(--blue-bg);  border-left: 3px solid var(--blue); }
.callout-icon { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; }
.callout-text { font-size: 13px; line-height: 1.65; }
.callout.tip  .callout-text { color: var(--green); }
.callout.warn .callout-text { color: var(--amber); }
.callout.info .callout-text { color: var(--blue); }

/* ═══════════════ SCHEMA ═══════════════ */
.schema-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.schema-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
}
.schema-row:last-child { border-bottom: none; }
.schema-row:hover { background: var(--bg); }
.schema-key {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--code-ink);
  width: 140px;
  flex-shrink: 0;
  padding-top: 1px;
}
.schema-type {
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--blue);
  width: 80px;
  flex-shrink: 0;
  padding-top: 1px;
}
.schema-desc {
  font-size: 13px;
  color: var(--ink-mid);
  flex: 1;
  line-height: 1.55;
}
.schema-example {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--ink-low);
  margin-top: 3px;
}

/* ═══════════════ DIVIDER ═══════════════ */
.divider { height: 1px; background: var(--border); margin: 28px 0; }

/* ═══════════════ TWEAKS PANEL ═══════════════ */
.tweaks-panel {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 260px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,.12);
  z-index: 1000;
  overflow: hidden;
  display: none;
}
.tweaks-panel.visible { display: block; }
.tweaks-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.tweaks-panel-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: .2px;
}
.tweaks-panel-close {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: none; cursor: pointer;
  color: var(--ink-low); border-radius: 4px;
  transition: background .13s;
}
.tweaks-panel-close:hover { background: var(--cat-bg); color: var(--ink); }
.tweaks-panel-close svg { width: 12px; height: 12px; }
.tweaks-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.tweak-row { display: flex; flex-direction: column; gap: 6px; }
.tweak-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .7px; color: var(--ink-low); }
.tweak-options { display: flex; gap: 5px; }
.tweak-opt {
  padding: 5px 10px;
  font-size: 12px;
  border: 1px solid var(--border);
  border-radius: 5px;
  cursor: pointer;
  background: none;
  color: var(--ink-mid);
  font-family: var(--font-sans);
  transition: all .13s;
}
.tweak-opt:hover { border-color: var(--border-hover); color: var(--ink); }
.tweak-opt.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.tweak-toggle { display: flex; align-items: center; justify-content: space-between; }
.tweak-toggle-label { font-size: 13px; color: var(--ink-mid); }
.toggle-switch {
  width: 34px; height: 19px;
  background: var(--border);
  border-radius: 100px;
  position: relative;
  cursor: pointer;
  transition: background .2s;
  border: none;
  flex-shrink: 0;
}
.toggle-switch.on { background: var(--ink); }
.toggle-switch::after {
  content: '';
  position: absolute;
  width: 14px; height: 14px;
  background: #fff;
  border-radius: 50%;
  top: 2.5px; left: 3px;
  transition: transform .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.toggle-switch.on::after { transform: translateX(15px); }

/* version selector */
.version-select {
  padding: 6px 10px;
  font-size: 12px;
  font-family: var(--font-sans);
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  outline: none;
  cursor: pointer;
  width: 100%;
}

/* Endpoint page breadcrumb */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 20px;
}
.bc-item { font-size: 13px; color: var(--ink-low); cursor: pointer; transition: color .13s; }
.bc-item:hover { color: var(--ink); }
.bc-sep { font-size: 12px; color: var(--border-hover); }
.bc-current { font-size: 13px; color: var(--ink-mid); }

/* inline code */
.ic {
  font-family: var(--font-mono);
  font-size: 12px;
  background: var(--code-bg);
  color: var(--code-ink);
  padding: 1px 5px;
  border-radius: 3px;
  border: 1px solid var(--border);
}

/* Loading spinner */
.spinner {
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Overview intro */
.overview-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 20px 0 28px;
}
.overview-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px;
}
.overview-card-label { font-size: 11px; font-weight: 500; letter-spacing: .8px; text-transform: uppercase; color: var(--ink-low); margin-bottom: 6px; }
.overview-card-value { font-size: 14px; color: var(--ink); }
.overview-card-value code { font-family: var(--font-mono); font-size: 13px; color: var(--code-ink); }
</style>
</head>

  return (
    <span className="method-badge" style={{
      color: s.color,
      background: s.bg,
      fontSize: size === "sm" ? "10px" : "12px",
      padding: size === "sm" ? "2px 6px" : "4px 10px",
    }}>
      {method}
    </span>
  );
}

function CopyBtn({ text }) {
  const [copied, setCopied] = useState(false);
  const copy = () => {
    navigator.clipboard?.writeText(text).catch(() => {});
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };
  return (
    <button className="copy-btn" onClick={copy}>
      {copied ? (
        <>
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round">
            <path d="M2 6l3 3 5-5"/>
          </svg>
          Copied
        </>
      ) : (
        <>
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.5">
            <rect x="4" y="4" width="7" height="7" rx="1.5"/>
            <path d="M8 4V2.5a1 1 0 00-1-1H2.5a1 1 0 00-1 1V8a1 1 0 001 1H4" strokeLinecap="round"/>
          </svg>
          Copy
        </>
      )}
    </button>
  );
}

function CodeSnippet({ lang, code }) {
  const [copied, setCopied] = useState(false);
  const copy = () => {
    navigator.clipboard?.writeText(code).catch(() => {});
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };
  return (
    <div className="code-snippet">
      <div className="code-snippet-header">
        <span className="code-snippet-lang">{lang}</span>
        <button className="code-snippet-copy" onClick={copy}>
          <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" strokeWidth="1.5">
            <rect x="3" y="3" width="6" height="6" rx="1"/>
            <path d="M7 3V1.5a1 1 0 00-1-1H1.5a1 1 0 00-1 1V6a1 1 0 001 1H3" strokeLinecap="round"/>
          </svg>
          {copied ? "Copied!" : "Copy"}
        </button>
      </div>
      <pre style={{ padding:"12px 14px", fontFamily:"var(--font-mono)", fontSize:"11.5px", lineHeight:"1.75", color:"var(--code-ink)", overflowX:"auto", whiteSpace:"pre" }}>{code}</pre>
    </div>
  );
}

/* ═══════════════ ENDPOINT PAGE ═══════════════ */
function EndpointPage({ endpointId, detail }) {
  const [activeResponse, setActiveResponse] = useState(Object.keys(detail.responses)[0]);
  const [tryOpen, setTryOpen] = useState(false);
  const [tryLoading, setTryLoading] = useState(false);
  const [tryResult, setTryResult] = useState(null);
  const [tryToken, setTryToken] = useState("");
  const [tryBody, setTryBody] = useState(
    detail.bodyParams ? `{\n  ${detail.bodyParams.filter(p=>p.required).map(p=>`"${p.name}": ""`).join(",\n  ")}\n}` : ""
  );

  const handleTry = () => {
    setTryLoading(true);
    setTryResult(null);
    setTimeout(() => {
      const firstKey = Object.keys(detail.responses)[0];
      const resp = detail.responses[firstKey];
      setTryResult({ statusKey: firstKey, resp, time: Math.floor(Math.random() * 120) + 40 });
      setTryLoading(false);
    }, 800 + Math.random() * 400);
  };

  const params = detail.queryParams || detail.bodyParams || [];
  const isBody = !!detail.bodyParams;
  const responseKeys = Object.keys(detail.responses);
  const activeResp = detail.responses[activeResponse];

  return (
    <div>
      <div className="breadcrumb">
        <span className="bc-item">API Reference</span>
        <span className="bc-sep">/</span>
        <span className="bc-item">{detail.path.split("/")[1]}</span>
        <span className="bc-sep">/</span>
        <span className="bc-current">{detail.summary}</span>
      </div>

      <div className="endpoint-header">
        <div className="endpoint-title-row">
          <MethodBadge method={detail.method} />
          <span className="endpoint-path">{detail.path}</span>
        </div>
        <div className="endpoint-tags-row">
          {detail.auth && <span className="tag auth">🔐 Auth required</span>}
          {detail.isNew && <span className="tag new">✦ New in v2</span>}
          {detail.tags.map(t => <span className="tag" key={t}>{t}</span>)}
        </div>
        <p className="endpoint-desc" style={{ marginTop:"14px" }}>{detail.description}</p>
      </div>

      <div className="divider"></div>

      {params.length > 0 && (
        <div className="section-block">
          <div className="section-label">{isBody ? "Request body" : "Query parameters"}</div>
          <div className="params-table">
            <div className="params-table-head">
              <span>Name</span>
              <span>Type</span>
              <span>Description</span>
              <span>Default</span>
            </div>
            {params.map(p => (
              <div className="param-row" key={p.name}>
                <span className="param-name">
                  {p.name}
                  {p.required && <span className="param-required">*</span>}
                </span>
                <span className="param-type">{p.type}</span>
                <span className="param-desc">{p.desc}</span>
                <span className="param-default">{p.default || "—"}</span>
              </div>
            ))}
          </div>
          {isBody && (
            <div className="callout info" style={{ marginTop:"14px" }}>
              <svg className="callout-icon" viewBox="0 0 18 18" fill="none">
                <circle cx="9" cy="9" r="7" stroke="#1A5EA8" strokeWidth="1.5"/>
                <path d="M9 8v5m0-7v.5" stroke="#1A5EA8" strokeWidth="1.5" strokeLinecap="round"/>
              </svg>
              <span className="callout-text">Send body as <span className="ic" style={{ fontSize:"11.5px" }}>Content-Type: application/json</span>. Fields marked <span style={{ color:"var(--red)" }}>*</span> are required.</span>
            </div>
          )}
        </div>
      )}

      <div className="section-block">
        <div className="section-label">Responses</div>
        <div className="response-tabs">
          {responseKeys.map(key => {
            const r = detail.responses[key];
            return (
              <button
                key={key}
                className={`response-tab${activeResponse === key ? " active" : ""}`}
                onClick={() => setActiveResponse(key)}
              >
                <span className="status-dot" style={{ background: r.dotColor }}></span>
                {r.label}
              </button>
            );
          })}
        </div>
        <div className="response-body">
          {activeResp && (
            <>
              <div style={{ borderBottom:"1px solid var(--border)", padding:"0" }}>
                <div style={{ padding:"12px 0 0", margin:"0 16px" }}>
                  <div className="section-label" style={{ marginBottom:"0" }}>Schema</div>
                </div>

                  <div className="schema-row" key={i}>
                    <span className="schema-key">{s.key}</span>
                    <span className="schema-type">{s.type}</span>
                    <div>
                      <div className="schema-desc">{s.desc}</div>
                      {s.example && <div className="schema-example">e.g. {s.example}</div>}
                    </div>
                  </div>
                ))}
              </div>
              <div style={{ padding:"12px 0 0", margin:"0 16px 0" }}>
                <div className="section-label">Example response</div>
              </div>
              <div style={{ margin:"0 0 0" }}>
                <div className="code-header" style={{ borderRadius:0, background:"var(--bg)", borderTop:"1px solid var(--border)", borderBottom:"1px solid var(--border)", borderLeft:"none", borderRight:"none" }}>
                  <span className="code-lang">JSON</span>
                  <CopyBtn text={activeResp.example} />

                <div className="code-body" style={{ borderRadius:"0 0 10px 10px" }}>
                  <pre style={{ fontSize:"12px" }}>{activeResp.example}</pre>

      <div className="try-panel">
        <div className="try-header" onClick={() => setTryOpen(o => !o)}>
          <div className="try-title">
            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round">
              <polygon points="3,1 13,7 3,13"/>
            </svg>
            Try it out
          </div>
          <svg className={`try-chevron${tryOpen ? " open" : ""}`} viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5">
            <path d="M3 5l4 4 4-4"/>
          </svg>
        </div>
        {tryOpen && (
          <div className="try-body">
            <div className="try-field">
              <label className="try-label">Authorization token</label>
              <input
                className="try-input"
                placeholder="Bearer eyJ0eXAi..."
                value={tryToken}
                onChange={e => setTryToken(e.target.value)}
              />
            </div>
            {isBody && (
              <div className="try-field">
                <label className="try-label">Request body (JSON)</label>
                <textarea
                  className="try-textarea"
                  value={tryBody}
                  onChange={e => setTryBody(e.target.value)}
                />
              </div>
            )}
            <div className="try-actions">
              <button className="btn-primary" onClick={handleTry} disabled={tryLoading}>
                {tryLoading ? (
                  <><div className="spinner"></div> Sending…</>
                ) : (
                  <><svg viewBox="0 0 13 13" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><polygon points="2,1 12,6.5 2,12" fill="currentColor" stroke="none"/></svg> Send Request</>
                )}
              </button>
              {tryResult && (
                <button className="btn-ghost" onClick={() => setTryResult(null)}>Clear</button>
              )}
            </div>
            {tryResult && (
              <div className="try-response">
                <div className="try-response-status">
                  <span className="try-response-label">Status</span>
                  <span className="try-response-code" style={{
                    background: tryResult.resp.dotColor === "var(--green)" ? "var(--green-bg)" : tryResult.resp.dotColor === "var(--red)" ? "var(--red-bg)" : "var(--amber-bg)",
                    color: tryResult.resp.dotColor === "var(--green)" ? "var(--green)" : tryResult.resp.dotColor === "var(--red)" ? "var(--red)" : "var(--amber)",
                  }}>
                    {tryResult.resp.label}
                  </span>
                  <span className="try-response-time">{tryResult.time} ms</span>
                </div>
                <div className="code-snippet">
                  <div className="code-snippet-header">
                    <span className="code-snippet-lang">Response</span>
                  </div>
                  <pre style={{ padding:"10px 12px", fontSize:"11.5px", fontFamily:"var(--font-mono)", lineHeight:"1.7", color:"var(--code-ink)", overflowX:"auto" }}>{tryResult.resp.example}</pre>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══════════════ APP ═══════════════ */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "Default",
  "showCode": true,
  "showTry": true,
  "version": "v2",
  "theme": "Light"
}/*EDITMODE-END*/;

function App() {
  const [activeId, setActiveId] = useState("overview");
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [tweaks, setTweaksState] = useState(TWEAK_DEFAULTS);

  const setTweak = (key, val) => {
    setTweaksState(p => {
      const next = { ...p, [key]: val };
      window.parent?.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
      return next;
    });
  };

  // Tweaks protocol
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent?.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  // Dark theme
  React.useEffect(() => {
    if (tweaks.theme === "Dark") {
      document.documentElement.style.setProperty('--bg', '#141210');
      document.documentElement.style.setProperty('--surface', '#1C1917');
      document.documentElement.style.setProperty('--ink', '#F0EDE8');
      document.documentElement.style.setProperty('--ink-mid', '#A09890');
      document.documentElement.style.setProperty('--ink-low', '#706860');
      document.documentElement.style.setProperty('--border', '#2E2A26');
      document.documentElement.style.setProperty('--border-hover', '#403830');
      document.documentElement.style.setProperty('--cat-bg', '#252018');
      document.documentElement.style.setProperty('--cat-ink', '#C0B8A8');
      document.documentElement.style.setProperty('--code-bg', '#1A1612');
      document.documentElement.style.setProperty('--code-ink', '#D0C8B8');
    } else {
      document.documentElement.style.setProperty('--bg', '#FAF7F2');
      document.documentElement.style.setProperty('--surface', '#FFFFFF');
      document.documentElement.style.setProperty('--ink', '#1A1A1A');
      document.documentElement.style.setProperty('--ink-mid', '#555555');
      document.documentElement.style.setProperty('--ink-low', '#888888');
      document.documentElement.style.setProperty('--border', '#E8E2D9');
      document.documentElement.style.setProperty('--border-hover', '#C8C0B4');
      document.documentElement.style.setProperty('--cat-bg', '#F0EDE8');
      document.documentElement.style.setProperty('--cat-ink', '#4A4540');
      document.documentElement.style.setProperty('--code-bg', '#F4F1EC');
      document.documentElement.style.setProperty('--code-ink', '#3D2B1F');
    }
  }, [tweaks.theme]);

  // Density
  React.useEffect(() => {
    const ep = document.querySelector('.endpoint-panel');
    if (!ep) return;
    const pad = tweaks.density === "Compact" ? "20px 28px 40px" : tweaks.density === "Spacious" ? "48px 56px 80px" : "32px 40px 60px";
    ep.style.padding = pad;
  }, [tweaks.density, activeId]);

  const activeDetail = ENDPOINT_DETAILS[activeId];

  return (
    <>
      {/* NAV */}
      <nav className="nav">
        <div className="nav-brand">
          Lesser Known Laravel
          <div className="nav-brand-sep"></div>
          <span className="nav-brand-section">API Reference</span>
        </div>
        <div className="nav-right">
          <span className="nav-badge">v{tweaks.version.replace("v","")}</span>
          <div className="nav-links">
            <a className="nav-link" href="#">Docs</a>
            <a className="nav-link active" href="#">API</a>
            <a className="nav-link" href="#">Changelog</a>
            <a className="nav-link cta" href="#">Get token →</a>
          </div>
        </div>
      </nav>

      {/* SHELL */}
      <div className="shell">
        <Sidebar groups={API_DATA.groups} activeId={activeId} onSelect={setActiveId} />

        <div className="main">
          <div className="endpoint-panel">
            {activeId === "overview"
              ? <OverviewPage apiData={API_DATA} />
              : activeDetail
                ? <EndpointPage endpointId={activeId} detail={activeDetail} key={activeId} />
                : (
                  <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", height:"100%", gap:"10px", color:"var(--ink-low)" }}>
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round">
                      <rect x="8" y="6" width="24" height="28" rx="3"/>
                      <path d="M14 14h12M14 19h12M14 24h8"/>
                    </svg>
                    <div style={{ fontSize:"14px" }}>Select an endpoint to view its documentation</div>
                  </div>
                )
            }
          </div>

          {tweaks.showCode && activeDetail && (
            <CodePanel detail={activeDetail} key={activeId + "-code"} />
          )}
        </div>
      </div>

      <TweaksPanel
        visible={tweaksVisible}
        onClose={() => {
          setTweaksVisible(false);
          window.parent?.postMessage({ type: '__edit_mode_dismissed' }, '*');
        }}
        tweaks={tweaks}
        setTweak={setTweak}
      />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
