<html lang="en">
<head>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --font-serif: 'Lora', Georgia, serif;
  --font-sans:  'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:  'Menlo', 'SF Mono', 'Courier New', monospace;

  --bg:          #FAF7F2;
  --surface:     #FFFFFF;
  --ink:         #1A1A1A;
  --ink-mid:     #555555;
  --ink-low:     #888888;
  --border:      #E8E2D9;
  --border-hover:#C8C0B4;
  --green:       #1E7E52;  --green-bg:  #EAF5EF;
  --amber:       #9A5F00;  --amber-bg:  #FFF3DC;
  --red:         #9A2800;  --red-bg:    #FFF0EC;
  --cat-bg:      #F0EDE8;  --cat-ink:   #4A4540;
  --blue:        #1A5EA8;  --blue-bg:   #EAF1FB;
  --code-bg:     #F4F1EC;  --code-ink:  #3D2B1F;

  --get:    #1E7E52; --get-bg:    #EAF5EF;
  --post:   #1A5EA8; --post-bg:   #EAF1FB;
  --put:    #9A5F00; --put-bg:    #FFF3DC;
  --patch:  #7A4F9A; --patch-bg:  #F3EAFB;
  --delete: #9A2800; --delete-bg: #FFF0EC;
}
html, body { font-family: var(--font-sans); font-size: 14px; line-height: 1.6; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; height: 100%; overflow: hidden; }
#root { height: 100vh; display: flex; flex-direction: column; }

/* NAV */
.nav { background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 52px; flex-shrink: 0; z-index: 100; gap: 12px; }
.nav-brand { font-family: var(--font-serif); font-size: 16px; font-weight: 400; color: var(--ink); letter-spacing: -.2px; display: flex; align-items: center; gap: 10px; white-space: nowrap; flex-shrink: 0; }
.nav-sep { width: 1px; height: 14px; background: var(--border); }
.nav-section { font-family: var(--font-sans); font-size: 12px; color: var(--ink-low); }
.nav-links { display: flex; align-items: center; gap: 3px; }
.nav-link { padding: 5px 11px; font-size: 13px; color: var(--ink-mid); border-radius: 6px; cursor: pointer; transition: background .15s, color .15s; text-decoration: none; background: none; border: none; font-family: var(--font-sans); }
.nav-link:hover { background: var(--cat-bg); color: var(--ink); }
.nav-link.active { color: var(--ink); font-weight: 500; }
.nav-link.cta { background: var(--ink); color: #fff; }
.nav-link.cta:hover { background: #333; }

/* LAYOUT */
.shell { display: flex; flex: 1; overflow: hidden; }

/* SIDEBAR (history) */
.sidebar { width: 232px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.sidebar-header { padding: 11px 14px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.sidebar-title { font-size: 11px; font-weight: 500; letter-spacing: .8px; text-transform: uppercase; color: var(--ink-low); }
.sidebar-clear { font-size: 11px; color: var(--ink-low); background: none; border: none; cursor: pointer; font-family: var(--font-sans); padding: 2px 6px; border-radius: 4px; transition: background .13s, color .13s; }
.sidebar-clear:hover { background: var(--cat-bg); color: var(--red); }

.sidebar-search { padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sidebar-search-wrap { position: relative; }
.sidebar-search-wrap svg { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; color: var(--ink-low); pointer-events: none; }
.sidebar-search-input { width: 100%; padding: 6px 8px 6px 26px; font-size: 12px; font-family: var(--font-sans); color: var(--ink); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; outline: none; transition: border-color .15s; }
.sidebar-search-input:focus { border-color: var(--border-hover); }
.sidebar-search-input::placeholder { color: var(--ink-low); }

.history-scroll { flex: 1; overflow-y: auto; padding: 6px 0 12px; }
.history-scroll::-webkit-scrollbar { width: 3px; }
.history-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.history-group-label { font-size: 10px; font-weight: 500; letter-spacing: .8px; text-transform: uppercase; color: var(--ink-low); padding: 8px 14px 4px; }
.history-item { display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer; border-radius: 0; transition: background .12s; border: none; background: none; width: 100%; text-align: left; font-family: var(--font-sans); }
.history-item:hover { background: var(--cat-bg); }
.history-item.active { background: var(--cat-bg); }
.history-method { font-size: 9px; font-weight: 600; letter-spacing: .4px; padding: 2px 5px; border-radius: 3px; flex-shrink: 0; min-width: 38px; text-align: center; }
.history-info { flex: 1; min-width: 0; }
.history-name { font-size: 12px; color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-url { font-size: 11px; color: var(--ink-low); font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-status { font-size: 10px; font-weight: 500; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; }

.sidebar-collections { padding: 10px 12px; border-top: 1px solid var(--border); flex-shrink: 0; }
.sidebar-collections-title { font-size: 10px; font-weight: 500; letter-spacing: .8px; text-transform: uppercase; color: var(--ink-low); margin-bottom: 8px; }
.collection-item { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 6px; cursor: pointer; transition: background .12s; }
.collection-item:hover { background: var(--cat-bg); }
.collection-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.collection-name { font-size: 12px; color: var(--ink-mid); }
.collection-count { font-size: 10px; color: var(--ink-low); margin-left: auto; }

/* MAIN */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* URL BAR */
.url-bar { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
.url-row { display: flex; align-items: center; gap: 8px; }
.method-select-wrap { position: relative; flex-shrink: 0; }
.method-select { appearance: none; -webkit-appearance: none; padding: 8px 28px 8px 11px; font-size: 12px; font-weight: 600; letter-spacing: .4px; font-family: var(--font-sans); border: 1px solid var(--border); border-radius: 7px; background: var(--bg); outline: none; cursor: pointer; transition: border-color .15s; min-width: 85px; }
.method-select:focus { border-color: var(--border-hover); }
.method-select-chevron { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; width: 10px; height: 10px; color: var(--ink-low); }
.url-input { flex: 1; padding: 8px 12px; font-size: 13px; font-family: var(--font-mono); color: var(--ink); background: var(--bg); border: 1px solid var(--border); border-radius: 7px; outline: none; transition: border-color .15s; }
.url-input:focus { border-color: var(--border-hover); background: var(--surface); }
.url-input::placeholder { color: var(--ink-low); font-family: var(--font-sans); font-size: 13px; }
.send-btn { padding: 8px 20px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 500; border: none; border-radius: 7px; cursor: pointer; font-family: var(--font-sans); transition: background .15s; display: flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap; }
.send-btn:hover { background: #333; }
.send-btn:disabled { background: var(--ink-low); cursor: not-allowed; }
.send-btn svg { width: 12px; height: 12px; }

.url-meta { display: flex; align-items: center; gap: 12px; }
.url-meta-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-low); }
.url-meta-item svg { width: 11px; height: 11px; }
.url-meta-tag { padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 500; }

/* CONTENT SPLIT */
.content-split { flex: 1; display: flex; overflow: hidden; }

/* REQUEST PANEL */
.req-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--border); min-width: 0; }
.panel-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--bg); padding: 0 4px; flex-shrink: 0; }
.panel-tab { padding: 9px 13px; font-size: 12px; color: var(--ink-low); cursor: pointer; border-bottom: 2px solid transparent; background: none; border-top: none; border-left: none; border-right: none; font-family: var(--font-sans); transition: color .13s; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
.panel-tab:hover { color: var(--ink-mid); }
.panel-tab.active { color: var(--ink); font-weight: 500; border-bottom-color: var(--ink); }
.tab-badge { font-size: 9px; background: var(--cat-bg); color: var(--cat-ink); padding: 1px 5px; border-radius: 10px; font-weight: 500; }
.tab-badge.active { background: var(--ink); color: #fff; }

.panel-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
.panel-body::-webkit-scrollbar { width: 3px; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* KV Table */
.kv-table { display: flex; flex-direction: column; gap: 6px; }
.kv-header { display: grid; grid-template-columns: 28px 1fr 1fr 28px; gap: 6px; padding: 0 2px; }
.kv-header span { font-size: 10px; font-weight: 500; letter-spacing: .7px; text-transform: uppercase; color: var(--ink-low); }
.kv-row { display: grid; grid-template-columns: 28px 1fr 1fr 28px; gap: 6px; align-items: center; }
.kv-check { width: 16px; height: 16px; accent-color: var(--ink); cursor: pointer; }
.kv-input { padding: 7px 9px; font-size: 12px; font-family: var(--font-mono); color: var(--ink); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; outline: none; transition: border-color .15s; width: 100%; }
.kv-input:focus { border-color: var(--border-hover); background: var(--surface); }
.kv-input::placeholder { color: var(--ink-low); font-family: var(--font-sans); font-size: 12px; }
.kv-del { width: 26px; height: 26px; background: none; border: none; cursor: pointer; color: var(--ink-low); border-radius: 5px; display: flex; align-items: center; justify-content: center; transition: background .12s, color .13s; }
.kv-del:hover { background: var(--red-bg); color: var(--red); }
.kv-del svg { width: 11px; height: 11px; }
.kv-add { display: flex; align-items: center; gap: 6px; padding: 6px 4px; font-size: 12px; color: var(--ink-low); background: none; border: none; cursor: pointer; font-family: var(--font-sans); transition: color .13s; margin-top: 2px; }
.kv-add:hover { color: var(--ink); }
.kv-add svg { width: 12px; height: 12px; }

/* Body editor */
.body-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.body-type-select { padding: 5px 8px; font-size: 12px; font-family: var(--font-sans); color: var(--ink); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; outline: none; cursor: pointer; }
.body-format-btn { padding: 5px 10px; font-size: 11px; background: var(--cat-bg); color: var(--cat-ink); border: none; border-radius: 5px; cursor: pointer; font-family: var(--font-sans); transition: background .13s; }
.body-format-btn:hover { background: var(--border); }
.body-textarea { width: 100%; min-height: 200px; padding: 11px 12px; font-size: 12.5px; font-family: var(--font-mono); color: var(--code-ink); background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; outline: none; resize: vertical; transition: border-color .15s; line-height: 1.7; }
.body-textarea:focus { border-color: var(--border-hover); }

/* Auth panel */
.auth-grid { display: flex; flex-direction: column; gap: 13px; }
.auth-type-row { display: flex; gap: 6px; flex-wrap: wrap; }
.auth-type-btn { padding: 6px 13px; font-size: 12px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; background: none; color: var(--ink-mid); font-family: var(--font-sans); transition: all .13s; }
.auth-type-btn:hover { border-color: var(--border-hover); color: var(--ink); }
.auth-type-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.auth-field { display: flex; flex-direction: column; gap: 5px; }
.auth-label { font-size: 11px; font-weight: 500; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-low); }
.auth-input { padding: 8px 10px; font-size: 13px; font-family: var(--font-mono); color: var(--ink); background: var(--bg); border: 1px solid var(--border); border-radius: 7px; outline: none; transition: border-color .15s; }
.auth-input:focus { border-color: var(--border-hover); background: var(--surface); }
.auth-hint { font-size: 12px; color: var(--ink-low); line-height: 1.6; }
.callout { border-radius: 8px; padding: 10px 13px; display: flex; gap: 9px; }
.callout.info { background: var(--blue-bg); border-left: 3px solid var(--blue); }
.callout.tip { background: var(--green-bg); border-left: 3px solid var(--green); }
.callout.warn { background: var(--amber-bg); border-left: 3px solid var(--amber); }
.callout-icon { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; }
.callout-text { font-size: 12px; line-height: 1.6; }
.callout.info .callout-text { color: var(--blue); }
.callout.tip  .callout-text { color: var(--green); }
.callout.warn .callout-text { color: var(--amber); }

/* RESPONSE PANEL */
.res-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.res-status-bar { padding: 9px 16px; border-bottom: 1px solid var(--border); background: var(--bg); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.res-status-code { font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 5px; }
.res-meta-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-low); }
.res-meta-item svg { width: 11px; height: 11px; }
.res-meta-sep { width: 1px; height: 12px; background: var(--border); }
.res-copy { margin-left: auto; font-size: 11px; color: var(--ink-low); background: none; border: 1px solid var(--border); border-radius: 5px; padding: 3px 9px; cursor: pointer; font-family: var(--font-sans); transition: all .13s; display: flex; align-items: center; gap: 4px; }
.res-copy:hover { border-color: var(--border-hover); color: var(--ink); }
.res-copy svg { width: 10px; height: 10px; }

.res-body { flex: 1; overflow-y: auto; }
.res-body::-webkit-scrollbar { width: 3px; }
.res-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Empty state */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: var(--ink-low); text-align: center; padding: 32px; }
.empty-state svg { width: 44px; height: 44px; opacity: .4; }
.empty-title { font-size: 14px; color: var(--ink-mid); }
.empty-sub { font-size: 12px; line-height: 1.6; max-width: 220px; }

/* Spinner */
.loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 14px; }
.big-spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--ink-mid); border-radius: 50%; animation: spin .8s linear infinite; }
.loading-text { font-size: 13px; color: var(--ink-low); }
@keyframes spin { to { transform: rotate(360deg); } }

/* Response tabs */
.res-tabs-bar { display: flex; padding: 0 4px; border-bottom: 1px solid var(--border); background: var(--bg); flex-shrink: 0; }
.res-tab { padding: 8px 12px; font-size: 12px; color: var(--ink-low); cursor: pointer; border-bottom: 2px solid transparent; background: none; border-top: none; border-left: none; border-right: none; font-family: var(--font-sans); transition: color .13s; }
.res-tab:hover { color: var(--ink-mid); }
.res-tab.active { color: var(--ink); font-weight: 500; border-bottom-color: var(--ink); }

/* JSON viewer */
.json-pre { padding: 16px; font-family: var(--font-mono); font-size: 12px; line-height: 1.75; color: var(--code-ink); overflow-x: auto; white-space: pre; background: var(--code-bg); min-height: 100%; }
.json-key { color: #1A5EA8; }
.json-str { color: #9A5F00; }
.json-num { color: #9A2800; }
.json-bool { color: #1E7E52; }
.json-null { color: #888; }

/* Headers table */
.headers-table { width: 100%; }
.headers-table tr:first-child td { padding-top: 16px; }
.headers-table td { padding: 6px 16px; font-size: 12px; vertical-align: top; border-bottom: 1px solid var(--border); }
.headers-table tr:last-child td { border-bottom: none; }
.hdr-key { font-family: var(--font-mono); font-size: 11.5px; color: var(--blue); width: 40%; }
.hdr-val { font-family: var(--font-mono); font-size: 11.5px; color: var(--code-ink); }

/* Tweaks */
.tweaks-panel { position: fixed; bottom: 20px; right: 20px; width: 252px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.12); z-index: 1000; overflow: hidden; display: none; }
.tweaks-panel.visible { display: block; }
.tweaks-header { display: flex; align-items: center; justify-content: space-between; padding: 11px 15px; border-bottom: 1px solid var(--border); background: var(--bg); }
.tweaks-title { font-size: 12px; font-weight: 500; color: var(--ink); }
.tweaks-close { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border: none; background: none; cursor: pointer; color: var(--ink-low); border-radius: 4px; transition: background .13s; }
.tweaks-close:hover { background: var(--cat-bg); color: var(--ink); }
.tweaks-close svg { width: 11px; height: 11px; }
.tweaks-body { padding: 13px 15px; display: flex; flex-direction: column; gap: 13px; }
.tweak-row { display: flex; flex-direction: column; gap: 5px; }
.tweak-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .7px; color: var(--ink-low); }
.tweak-options { display: flex; gap: 4px; flex-wrap: wrap; }
.tweak-opt { padding: 5px 10px; font-size: 12px; border: 1px solid var(--border); border-radius: 5px; cursor: pointer; background: none; color: var(--ink-mid); font-family: var(--font-sans); transition: all .13s; }
.tweak-opt:hover { border-color: var(--border-hover); color: var(--ink); }
.tweak-opt.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.tweak-toggle-row { display: flex; align-items: center; justify-content: space-between; }
.tweak-toggle-lbl { font-size: 13px; color: var(--ink-mid); }
.toggle-sw { width: 32px; height: 18px; background: var(--border); border-radius: 100px; position: relative; cursor: pointer; transition: background .2s; border: none; flex-shrink: 0; }
.toggle-sw.on { background: var(--ink); }
.toggle-sw::after { content: ''; position: absolute; width: 13px; height: 13px; background: #fff; border-radius: 50%; top: 2.5px; left: 2.5px; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.toggle-sw.on::after { transform: translateX(14px); }

/* Inline code */
.ic { font-family: var(--font-mono); font-size: 11px; background: var(--code-bg); color: var(--code-ink); padding: 1px 4px; border-radius: 3px; border: 1px solid var(--border); }
</style>
</head>

<div id="root"></div>

function pickMockResponse(method, url) {
  const u = url.toLowerCase();
  if (!url.trim()) return null;
  if (u.includes("auth/token") || u.includes("login")) return MOCK_RESPONSES.auth_token;
  if (u.includes("/users") && method === "POST") return MOCK_RESPONSES.created;
  if (u.includes("/users")) return MOCK_RESPONSES.users_list;
  if (u.includes("nonexistent") || u.includes("404")) return MOCK_RESPONSES.not_found;
  if (u.includes("error") || u.includes("500")) return MOCK_RESPONSES.server_error;
  if (!url.includes("token") && (method === "GET" || method === "DELETE")) {
    const rand = Math.random();
    if (rand < 0.15) return MOCK_RESPONSES.unauthorized;
  }
  if (method === "POST" || method === "PUT" || method === "PATCH") return MOCK_RESPONSES.created;
  return MOCK_RESPONSES.users_list;
}

/* ─── JSON SYNTAX HIGHLIGHT ──────────────────── */
function syntaxHighlight(obj) {
  const json = JSON.stringify(obj, null, 2);
  return json
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, (match) => {
      let cls = 'json-num';
      if (/^"/.test(match)) {
        cls = /:$/.test(match) ? 'json-key' : 'json-str';
      } else if (/true|false/.test(match)) {
        cls = 'json-bool';
      } else if (/null/.test(match)) {
        cls = 'json-null';
      }
      return `<span class="${cls}">${match}</span>`;
    });
}

/* ─── STATUS COLOR ───────────────────────────── */
function statusStyle(code) {
  if (!code) return { color: "var(--ink-low)", bg: "var(--cat-bg)" };
  if (code < 300) return { color: "var(--green)", bg: "var(--green-bg)" };
  if (code < 400) return { color: "var(--blue)",  bg: "var(--blue-bg)" };
  if (code < 500) return { color: "var(--amber)", bg: "var(--amber-bg)" };
  return { color: "var(--red)", bg: "var(--red-bg)" };
}

/* ─── KV EDITOR ──────────────────────────────── */
function KVEditor({ rows, onChange }) {
  const add = () => onChange([...rows, { id: Date.now(), enabled: true, key: "", value: "" }]);
  const del = (id) => onChange(rows.filter(r => r.id !== id));
  const upd = (id, field, val) => onChange(rows.map(r => r.id === id ? { ...r, [field]: val } : r));

  return (
    <div className="kv-table">
      <div className="kv-header">
        <span></span><span>Key</span><span>Value</span><span></span>
      </div>
      {rows.map(row => (
        <div className="kv-row" key={row.id}>
          <input type="checkbox" className="kv-check" checked={row.enabled} onChange={e => upd(row.id, "enabled", e.target.checked)} />
          <input className="kv-input" placeholder="key" value={row.key} onChange={e => upd(row.id, "key", e.target.value)} />
          <input className="kv-input" placeholder="value" value={row.value} onChange={e => upd(row.id, "value", e.target.value)} />
          <button className="kv-del" onClick={() => del(row.id)}>
            <svg viewBox="0 0 11 11" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round">
              <path d="M2 2l7 7M9 2l-7 7"/>
            </svg>
          </button>
        </div>
      ))}
      <button className="kv-add" onClick={add}>
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round">
          <path d="M6 2v8M2 6h8"/>
        </svg>
        Add row
      </button>
    </div>
  );
}

/* ─── RESPONSE PANEL ─────────────────────────── */
function ResponsePanel({ response, loading }) {
  const [tab, setTab] = useState("body");
  const [copied, setCopied] = useState(false);

  const copy = () => {
    if (!response) return;
    navigator.clipboard?.writeText(JSON.stringify(response.body, null, 2)).catch(() => {});
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };

  if (loading) {
    return (
      <div className="res-panel">
        <div style={{ padding:"9px 16px", borderBottom:"1px solid var(--border)", background:"var(--bg)", height:"38px" }}></div>
        <div className="loading-state">
          <div className="big-spinner"></div>
          <div className="loading-text">Sending request…</div>
        </div>
      </div>
    );
  }

  if (!response) {
    return (
      <div className="res-panel">
        <div style={{ padding:"9px 16px", borderBottom:"1px solid var(--border)", background:"var(--bg)", height:"38px" }}></div>
        <div className="empty-state">
          <svg viewBox="0 0 44 44" fill="none" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round">
            <rect x="6" y="8" width="32" height="28" rx="3"/>
            <path d="M14 16h16M14 22h16M14 28h8"/>
            <path d="M34 34l5 5" strokeWidth="2"/>
            <circle cx="34" cy="34" r="5"/>
          </svg>
          <div className="empty-title">No response yet</div>
          <div className="empty-sub">Hit Send to make a request. The response will appear here.</div>
        </div>
      </div>
    );
  }

  const ss = statusStyle(response.status);
  const statusLabel = {200:"OK", 201:"Created", 400:"Bad Request", 401:"Unauthorized", 403:"Forbidden", 404:"Not Found", 422:"Unprocessable", 429:"Too Many Requests", 500:"Server Error"}[response.status] || "";

  return (
    <div className="res-panel">
      <div className="res-status-bar">
        <span className="res-status-code" style={{ color: ss.color, background: ss.bg }}>{response.status} {statusLabel}</span>
        <div className="res-meta-sep"></div>
        <div className="res-meta-item">
          <svg viewBox="0 0 11 11" fill="none" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round">
            <circle cx="5.5" cy="5.5" r="4.5"/><path d="M5.5 3v3l2 1.5"/>
          </svg>
          {response.time} ms
        </div>
        <div className="res-meta-sep"></div>
        <div className="res-meta-item">
          <svg viewBox="0 0 11 11" fill="none" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round">
            <rect x="1" y="1" width="9" height="9" rx="1.5"/>
          </svg>
          {response.size}
        </div>
        <button className="res-copy" onClick={copy}>
          <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" strokeWidth="1.3">
            <rect x="3" y="3" width="6" height="6" rx="1"/>
            <path d="M7 3V1.5a1 1 0 00-1-1H1.5a1 1 0 00-1 1V6a1 1 0 001 1H3" strokeLinecap="round"/>
          </svg>
          {copied ? "Copied!" : "Copy"}
        </button>
      </div>
      <div className="res-tabs-bar">
        {["body", "headers"].map(t => (
          <button key={t} className={`res-tab${tab === t ? " active" : ""}`} onClick={() => setTab(t)}>
            {t === "body" ? "Body" : "Headers"}{t === "headers" ? ` (${Object.keys(response.headers || {}).length})` : ""}
          </button>
        ))}
      </div>
      <div className="res-body">
        {tab === "body" && (
          <div className="json-pre" dangerouslySetInnerHTML={{ __html: syntaxHighlight(response.body) }} />
        )}
        {tab === "headers" && (
          <table className="headers-table">
            <tbody>
              {Object.entries(response.headers || {}).map(([k, v]) => (
                <tr key={k}>
                  <td className="hdr-key">{k}</td>
                  <td className="hdr-val">{v}</td>

            </tbody>
          </table>
        )}

    });
  };

  // Tweaks protocol
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent?.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  // Dark theme
  useEffect(() => {
    const root = document.documentElement;
    if (tweaks.theme === "Dark") {
      root.style.setProperty('--bg', '#141210');
      root.style.setProperty('--surface', '#1C1917');
      root.style.setProperty('--ink', '#F0EDE8');
      root.style.setProperty('--ink-mid', '#A09890');
      root.style.setProperty('--ink-low', '#706860');
      root.style.setProperty('--border', '#2E2A26');
      root.style.setProperty('--border-hover', '#403830');
      root.style.setProperty('--cat-bg', '#252018');
      root.style.setProperty('--cat-ink', '#C0B8A8');
      root.style.setProperty('--code-bg', '#1A1612');
      root.style.setProperty('--code-ink', '#D0C8B8');
    } else {
      root.style.setProperty('--bg', '#FAF7F2');
      root.style.setProperty('--surface', '#FFFFFF');
      root.style.setProperty('--ink', '#1A1A1A');
      root.style.setProperty('--ink-mid', '#555555');
      root.style.setProperty('--ink-low', '#888888');
      root.style.setProperty('--border', '#E8E2D9');
      root.style.setProperty('--border-hover', '#C8C0B4');
      root.style.setProperty('--cat-bg', '#F0EDE8');
      root.style.setProperty('--cat-ink', '#4A4540');
      root.style.setProperty('--code-bg', '#F4F1EC');
      root.style.setProperty('--code-ink', '#3D2B1F');
    }
  }, [tweaks.theme]);

  // Font size
  useEffect(() => {
    const sz = tweaks.fontSize === "Small" ? "12px" : tweaks.fontSize === "Large" ? "15px" : "14px";
    document.documentElement.style.fontSize = sz;
  }, [tweaks.fontSize]);

  // Method color on select
  const ms = METHOD_CFG[method] || {};

  const send = () => {
    if (!url.trim()) return;
    setLoading(true);
    setResponse(null);
    const delay = 400 + Math.random() * 600;
    setTimeout(() => {
      const mock = pickMockResponse(method, url);
      const resp = mock || MOCK_RESPONSES.not_found;
      const jitter = Math.floor(Math.random() * 60) - 20;
      setResponse({ ...resp, time: resp.time + jitter });
      setLoading(false);
      // add to history
      const now = new Date();
      const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
      const pathName = url.split("/").filter(Boolean).pop() || url;
      const newEntry = {
        id: Date.now(),
        name: pathName.charAt(0).toUpperCase() + pathName.slice(1).replace(/\?.*/, ""),
        method, url,
        status: resp.status,
        ts: timeStr
      };
      setHistory(h => [newEntry, ...h.slice(0, 19)]);
      setActiveHistId(newEntry.id);
    }, delay);
  };

  const loadHistory = (item) => {
    setMethod(item.method);
    setUrl(item.url);
    setActiveHistId(item.id);
    setResponse(null);
  };

  const handleKey = (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send(); };

  return (
    <>
      {/* NAV */}
      <nav className="nav">
        <div className="nav-brand">
          Lesser Known Laravel
          <div className="nav-sep"></div>
          <span className="nav-section">HTTP Client</span>
        </div>
        <div className="nav-links">
          <a className="nav-link" href="API Docs.html">API Docs</a>
          <a className="nav-link active" href="#">HTTP Client</a>
          <a className="nav-link" href="#">Changelog</a>
          <a className="nav-link cta" href="#">Get token →</a>
        </div>
      </nav>

      <div className="shell">
        {tweaks.showSidebar && (
          <Sidebar
            history={history}
            activeId={activeHistId}
            onSelect={loadHistory}
            onClear={() => setHistory([])}
          />
        )}

        <div className="main">
          {/* URL BAR */}
          <div className="url-bar">
            <div className="url-row">
              <div className="method-select-wrap">
                <select
                  className="method-select"
                  value={method}
                  onChange={e => setMethod(e.target.value)}
                  style={{ color: ms.color, borderColor: ms.bg === "var(--cat-bg)" ? "var(--border)" : ms.bg }}
                >
                  {Object.keys(METHOD_CFG).map(m => (
                    <option key={m} value={m}>{m}</option>
                  ))}
                </select>
                <svg className="method-select-chevron" viewBox="0 0 10 10" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round">
                  <path d="M2 4l3 3 3-3"/>
                </svg>
              </div>
              <input
                className="url-input"
                placeholder="https://api.example.com/v2/…"
                value={url}
                onChange={e => setUrl(e.target.value)}
                onKeyDown={handleKey}
              />
              <button className="send-btn" onClick={send} disabled={loading || !url.trim()}>
                {loading ? (
                  <><div style={{ width:"12px", height:"12px", border:"2px solid rgba(255,255,255,.3)", borderTopColor:"#fff", borderRadius:"50%", animation:"spin .7s linear infinite" }}></div> Sending</>
                ) : (
                  <><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><polygon points="2,1.5 11,6 2,10.5" fill="currentColor" stroke="none"/></svg> Send</>
                )}
              </button>
            </div>
            <div className="url-meta">
              <div className="url-meta-item">
                <svg viewBox="0 0 11 11" fill="none" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round">
                  <circle cx="5.5" cy="5.5" r="4.5"/>
                  <path d="M5.5 2v2M5.5 7v2M2 5.5h2M7 5.5h2"/>
                </svg>
                <span className="ic" style={{ fontSize:"10px" }}>api.example.com</span>
              </div>
              <div className="url-meta-item">
                <svg viewBox="0 0 11 11" fill="none" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round">
                  <rect x="2" y="5" width="7" height="5" rx="1"/>
                  <path d="M3.5 5V3.5a2 2 0 014 0V5"/>
                </svg>
                HTTPS
              </div>
              <span className="url-meta-tag" style={{ background:"var(--green-bg)", color:"var(--green)" }}>v2</span>
              <div style={{ marginLeft:"auto", fontSize:"11px", color:"var(--ink-low)" }}>
                ⌘ + Enter to send
              </div>
            </div>
          </div>

          {/* SPLIT */}
          <div className="content-split" style={{ flexDirection: tweaks.layout === "Vertical" ? "column" : "row" }}>
            <RequestPanel
              params={params} setParams={setParams}
              headers={headers} setHeaders={setHeaders}
              body={body} setBody={setBody}
              bodyType={bodyType} setBodyType={setBodyType}
              authType={authType} setAuthType={setAuthType}
              authToken={authToken} setAuthToken={setAuthToken}
              authUser={authUser} setAuthUser={setAuthUser}
              authPass={authPass} setAuthPass={setAuthPass}
            />
            <ResponsePanel response={response} loading={loading} />
          </div>
        </div>
      </div>

      <TweaksPanel
        visible={tweaksVisible}
        onClose={() => {
          setTweaksVisible(false);
          window.parent?.postMessage({ type: '__edit_mode_dismissed' }, '*');
        }}
        tweaks={tweaks}
        setTweak={setTweak}
      />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
